[pytest]
#配置常用运行参数
addopts = -vs --alluredir=report  --clean-alluredir
# 把项目根目录加入 Python 模块搜索路径
pythonpath = .
#配置测试用例的位置
testpaths = ./scripts
#配置模块名的规则
python_files =test_*.py
#配置类的规则
python_classes = Test*
#配置测试用例（方法）的规则
python_functions = test_*
#配置 allure 报告的参数
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True


